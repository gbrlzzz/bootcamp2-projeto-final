<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex do Time — Bootcamp II</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pokédex do Time</h1>
    <p>Busque um Pokémon, dê sua nota e veja o que o time acha dele</p>
  </header>

  <main>
    <!-- Busca na PokeAPI -->
    <section class="busca">
      <input
        type="text"
        id="campo-busca"
        placeholder="Ex.: pikachu ou 25"
        autocomplete="off"
        autofocus
      >
      <button id="botao-buscar">Buscar</button>
      <button id="botao-aleatorio" title="Sortear um Pokémon">🎲 Aleatório</button>
    </section>

    <!-- Cartão do Pokémon + formulário de avaliação (preenchidos pelo script.js) -->
    <section id="resultado" aria-live="polite"></section>

    <!-- Mural de avaliações persistidas no Supabase -->
    <section class="mural">
      <div class="mural-topo">
        <h2>📋 Mural de avaliações</h2>
        <input type="search" id="filtro-mural" placeholder="Filtrar por Pokémon ou autor">
      </div>
      <div id="lista-avaliacoes"></div>
    </section>
  </main>

  <footer>
    Dados: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokeAPI</a>
    · Persistência: <a href="https://supabase.com" target="_blank" rel="noopener">Supabase</a>
    · Bootcamp II — Projeto Final
  </footer>

  <!-- Biblioteca do Supabase e configuração ANTES do script principal -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
